services:
  nginx:
    image: nginx:latest
    container_name: nginx-compose-test
    ports:
      - "8081:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped

  tester:
    image: curlimages/curl:latest
    container_name: docker-network-test
    command: ["sleep", "infinity"]
    restart: unless-stopped
